# Configuration for Ubuntu Production / Live Deployment
spring:
  config:
    activate:
      on-profile: live

usbshield:
  agent:
    # Central Admin Server URL
    server-url: ${USBSHIELD_SERVER_URL:}
    require-https: true
    tls-ca-certificate: ${USBSHIELD_TLS_CA_CERTIFICATE:}
    # Secret enrollment bootstrap token
    enrollment-token: ${USBSHIELD_ENROLLMENT_TOKEN:default-enrollment-secret}
    # Production directories on Ubuntu Linux
    data-dir: ${USBSHIELD_DATA_DIR:/var/lib/usbshield-agent}
    require-absolute-storage: true
    config-dir: ${USBSHIELD_CONFIG_DIR:/etc/usbshield-agent}
    heartbeat-interval-ms: 5000
    notification-enabled: true
    # Simulation must NEVER run in live/hardware profile
    simulation-enabled: false

logging:
  level:
    com.group.usbshield.agent: INFO
    root: WARN

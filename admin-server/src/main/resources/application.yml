server:
  address: 127.0.0.1
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true
        same-site: strict

spring:
  application:
    name: usbshield-admin-server

  datasource:
    url: jdbc:postgresql://${USBSHIELD_DB_HOST:127.0.0.1}:${USBSHIELD_DB_PORT:5432}/${USBSHIELD_DB_NAME:usbshield}
    driver-class-name: org.postgresql.Driver
    username: ${USBSHIELD_DB_USERNAME:usbshield}
    password: ${USBSHIELD_DB_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          halt_on_error: true


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.group.usbshield.server: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

usbshield:
  enrollment-token: ${USBSHIELD_ENROLLMENT_TOKEN:}
  admin:
    username: ${USBSHIELD_ADMIN_USERNAME:admin}
    password: ${USBSHIELD_ADMIN_PASSWORD:}
  offline-after-seconds: 90

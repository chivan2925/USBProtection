# Root-managed Ubuntu Agent config. No secrets or private keys should be committed here.
# HTTPS is mandatory for the live profile; use the server's DNS name on the certificate.
spring:
  application:
    name: usbshield-agent
  main:
    web-application-type: none
usbshield:
  agent:
    # Missing value deliberately prevents service startup: no localhost/HTTP fallback.
    server-url: ${USBSHIELD_SERVER_URL:}
    require-https: true
    # Optional: absolute path of an internal CA's PEM certificate for a private PKI.
    # If empty, JVM trust store and hostname validation are used.
    tls-ca-certificate: ${USBSHIELD_TLS_CA_CERTIFICATE:}
    enrollment-token: ${USBSHIELD_ENROLLMENT_TOKEN:}
    heartbeat-interval-ms: 5000
    data-dir: /var/lib/usbshield-agent
    require-absolute-storage: true
    config-dir: /etc/usbshield-agent
    simulation-enabled: false
    notification-enabled: true
logging:
  level:
    com.group.usbshield.agent: INFO
    root: INFO
